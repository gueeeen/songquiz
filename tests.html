<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>測試</title>
<style>
  body {
    margin: 0;
    padding: 24px;
    background: #14161c;
    color: #d8dbe4;
    font: 15px/1.7 "Segoe UI", "Microsoft JhengHei", sans-serif;
  }
  h1 {
    margin: 0 0 4px;
    font-size: 22px;
    font-family: Consolas, monospace;
  }
  h1.pass { color: #57d98a; }
  h1.fail { color: #ff6b6b; }
  p.hint { margin: 0 0 20px; color: #7c8494; font-size: 13px; }
  h2 {
    margin: 24px 0 8px;
    font-size: 14px;
    font-weight: normal;
    color: #7c8494;
    border-bottom: 1px solid #262a33;
    padding-bottom: 4px;
  }
  ul { margin: 0; padding: 0; list-style: none; }
  li { padding: 2px 0; }
  li.pass::before { content: "通過　"; color: #57d98a; }
  li.fail::before { content: "失敗　"; color: #ff6b6b; }
  li.fail { color: #ff9d9d; }
  li .why {
    display: block;
    margin-left: 4em;
    color: #ffc9c9;
    font-family: Consolas, monospace;
    font-size: 13px;
  }
</style>
</head>
<body>

<h1 id="result">RESULT 尚未執行</h1>
<p class="hint">這一頁打開就跑完所有測試。沒有 Node、沒有測試框架，所以結果直接畫進 DOM，讓無頭瀏覽器 dump 出來也判讀得到。</p>
<div id="report"></div>

<!-- 載入順序是死的：game.js 在 IIFE 裡就抓 window.Rules，questions.js 也要先於它。 -->
<script src="js/rules.js"></script>
<script src="js/questions.js"></script>
<script src="js/game.js"></script>
<script>
(function () {
  'use strict';

  var Rules = window.Rules;

  // ---------------------------------------------------------------- 跑法

  var results = [];
  var currentGroup = '其他';

  function group(name) {
    currentGroup = name;
  }

  function test(name, fn) {
    var entry = { group: currentGroup, name: name, ok: true, why: '' };
    try {
      fn();
    } catch (error) {
      entry.ok = false;
      entry.why = (error && error.message) ? error.message : String(error);
    }
    results.push(entry);
  }

  /** 把值印成看得懂的樣子，失敗訊息才能直接看出差在哪。 */
  function show(value) {
    if (typeof value === 'string') return '「' + value + '」';
    if (value === null) return 'null';
    if (value === undefined) return 'undefined';
    if (Array.isArray(value)) return '[' + value.map(show).join(', ') + ']';
    return String(value);
  }

  /** 陣列要逐項比，不然「選項標籤一不一樣」這種斷言只會比到參考位址。 */
  function same(a, b) {
    if (Array.isArray(a) && Array.isArray(b)) {
      if (a.length !== b.length) return false;
      for (var i = 0; i < a.length; i++) {
        if (!same(a[i], b[i])) return false;
      }
      return true;
    }
    return a === b;
  }

  function assertEqual(expected, actual, note) {
    if (!same(expected, actual)) {
      throw new Error((note ? note + '，' : '') + '預期 ' + show(expected) + '，實際 ' + show(actual));
    }
  }

  function assertTrue(value, note) {
    if (!value) throw new Error((note || '斷言') + '：預期成立，實際不成立');
  }

  function assertThrows(fn, note) {
    var threw = false;
    try {
      fn();
    } catch (error) {
      threw = true;
    }
    if (!threw) throw new Error((note || '斷言') + '：預期丟出錯誤，實際順利跑完');
  }

  // ------------------------------------------------------------ 測試替身

  /**
   * 假時鐘。計分只看兩次 now() 的差，真時鐘會讓 1000 分與 999 分的邊界
   * 變成「機器夠不夠快」的賭博。起點刻意不是 0，順便擋住把 issuedAt 當成 0 的實作。
   */
  function makeClock() {
    var seconds = 1000;
    return {
      now: function () { return seconds; },
      advance: function (delta) { seconds += delta; },
    };
  }

  /** 線性同餘亂數。要的不是品質，是「同一顆種子永遠出一樣的題」。 */
  function makeRng(seed) {
    var state = seed >>> 0;
    return function () {
      state = (state * 1664525 + 1013904223) >>> 0;
      return state / 4294967296;
    };
  }

  /**
   * 自己造題庫，不碰 data/bank.js——那是產生物（可能不存在），
   * 而且真實題庫的歌數會隨著重建題庫而變，測試會跟著飄。
   *
   * @param {Array<Array>} spec 形如 [['mandarin', 40], ...]
   * @param {number} decoyCount 誘餌數（華語）
   */
  function bankOf(spec, decoyCount) {
    var tracks = [];
    var id = 1;

    spec.forEach(function (pair) {
      var language = pair[0];
      for (var i = 0; i < pair[1]; i++) {
        tracks.push({
          id: id,
          title: language + '-歌' + i,
          artist: language + '-歌手' + i,
          language: language,
          previewUrl: 'https://example.test/' + id + '.m4a',
        });
        id++;
      }
    });

    var decoys = [];
    for (var d = 0; d < (decoyCount || 0); d++) {
      decoys.push({ title: '誘餌' + d, artist: '誘餌歌手' + d, language: 'mandarin' });
    }

    return { tracks: tracks, decoys: decoys };
  }

  /** 每個語種都夠多歌，六關 × 每關二十題也跑得完。 */
  function fullBank(perLanguage) {
    return bankOf(Rules.LANGUAGES.map(function (language) {
      return [language, perLanguage || 40];
    }), 0);
  }

  /**
   * 開一場測試用的遊戲。語種與題數不給就是「全語種、每關十題」，
   * 也就是舊版寫死的那組設定——既有測試因此還測得到同一條行為。
   */
  function newGame(options) {
    options = options || {};
    var clock = makeClock();
    var game = new window.Game({
      mode: options.mode,
      bank: options.bank || fullBank(40),
      languages: options.languages || Rules.LANGUAGES,
      questionCount: options.questionCount || Rules.QUESTIONS_PER_ROUND,
      now: clock.now,
      rng: makeRng(options.seed === undefined ? 1 : options.seed),
    });
    return { game: game, clock: clock };
  }

  function answerCorrectly(game) {
    assertTrue(game.current !== null, '現在沒有題目可以答');
    return game.answer(game.current.answerId);
  }

  function answerWrongly(game) {
    assertTrue(game.current !== null, '現在沒有題目可以答');
    return game.answer(game.current.answerId === 0 ? 1 : 0);
  }

  /** 全對且零秒答完一整關，也就是這一關滿分。 */
  function perfectRound(game) {
    for (var i = 0; i < game.questionCount; i++) {
      assertTrue(game.nextQuestion() !== null, '第 ' + (i + 1) + ' 題出不來');
      answerCorrectly(game);
    }
  }

  /**
   * 打完一整關：先 perfect 題秒答（每題 1000），
   * 接著 slowCorrect 題慢 24 毫秒答對（每題 999），其餘全錯。回傳最後一題的回報。
   */
  function playRound(game, clock, perfect, slowCorrect) {
    var last = null;

    for (var i = 0; i < game.questionCount; i++) {
      game.nextQuestion();

      if (i < perfect) {
        last = answerCorrectly(game);
      } else if (i < perfect + slowCorrect) {
        clock.advance(0.024);
        last = answerCorrectly(game);
      } else {
        clock.advance(1);
        last = answerWrongly(game);
      }
    }

    return last;
  }

  function languagesOf(records) {
    return records.map(function (record) { return record.language; });
  }

  function thresholdsOf(stages) {
    return stages.map(function (stage) { return stage.scoreToClear; });
  }

  // -------------------------------------------------------------- 計分邊界

  group('計分邊界');

  test('答錯一律零分，不管多快按下去', function () {
    assertEqual(0, Rules.scoreFor(false, 0));
    assertEqual(0, Rules.scoreFor(false, 6));
  });

  test('秒答拿滿分一千', function () {
    assertEqual(Rules.BASE_SCORE + Rules.SPEED_BONUS, Rules.scoreFor(true, 0));
    assertEqual(1000, Rules.scoreFor(true, 0));
  });

  test('用掉一半時間拿保底加一半獎勵', function () {
    assertEqual(Rules.BASE_SCORE + Rules.SPEED_BONUS / 2, Rules.scoreFor(true, 6));
    assertEqual(750, Rules.scoreFor(true, 6));
  });

  test('十二秒是硬邊界：十一點九秒還有分，十二秒整就當沒答到', function () {
    assertEqual(504, Rules.scoreFor(true, 11.9), '十一點九秒答對');
    assertEqual(0, Rules.scoreFor(true, Rules.QUESTION_SECONDS), '十二秒整答對');
    assertEqual(0, Rules.scoreFor(true, 30), '逾時很久才答對');
  });

  test('競速十題的滿分是一萬', function () {
    assertEqual(10000, Rules.PERFECT_SCORE);
    assertEqual(10000, Rules.scoreFor(true, 0) * Rules.QUESTIONS_PER_ROUND);
    assertEqual(10000, Rules.perfectScoreFor('speed', 10));
  });

  test('滿分跟著題數走', function () {
    assertEqual(5000, Rules.perfectScoreFor('speed', 5));
    assertEqual(20000, Rules.perfectScoreFor('speed', 20));
    assertEqual(15000, Rules.perfectScoreFor('stage', 15), '闖關算的是單關滿分');
  });

  // ---------------------------------------------------------------- 關卡表

  group('關卡表');

  test('選五個語種、每關十題時，六關門檻是四千到九千', function () {
    var stages = Rules.stagesFor(Rules.LANGUAGES, 10, 'stage');

    assertEqual(6, stages.length, '關數');
    assertEqual([4000, 5000, 6000, 7000, 8000, 9000], thresholdsOf(stages));
  });

  test('關卡的語種只會越開越多，不會中途收回', function () {
    var stages = Rules.stagesFor(Rules.LANGUAGES, 10, 'stage');

    for (var i = 1; i < stages.length; i++) {
      var before = stages[i - 1].languages;
      var after = stages[i].languages;
      before.forEach(function (language) {
        assertTrue(after.indexOf(language) !== -1,
          '第 ' + (i + 1) + ' 關少了前一關有的 ' + language);
      });
    }
  });

  test('每一關新解鎖的語種都真的是新的', function () {
    var seen = {};
    Rules.stagesFor(Rules.LANGUAGES, 10, 'stage').forEach(function (stage) {
      if (stage.unlocks) {
        assertTrue(!seen[stage.unlocks],
          '第 ' + stage.number + ' 關重複解鎖了 ' + stage.unlocks);
        seen[stage.unlocks] = true;
      } else {
        stage.languages.forEach(function (language) { seen[language] = true; });
      }
    });
  });

  test('選三個語種就是四關，語種逐關累積', function () {
    var stages = Rules.stagesFor(['mandarin', 'taiwanese', 'western'], 10, 'stage');

    assertEqual(4, stages.length, '關數');
    assertEqual([1, 2, 3, 4], stages.map(function (s) { return s.number; }));
    assertEqual(['mandarin'], stages[0].languages);
    assertEqual(['mandarin', 'taiwanese'], stages[1].languages);
    assertEqual(['mandarin', 'taiwanese', 'western'], stages[2].languages);
    assertEqual(['mandarin', 'taiwanese', 'western'], stages[3].languages, '最後一關開放全部');
    assertEqual([null, 'taiwanese', 'western', null],
      stages.map(function (s) { return s.unlocks; }), '解鎖的語種');
  });

  test('只選一個語種就只有一關，門檻取六成', function () {
    // 只有一個語種時沒有「逐關解鎖」可演，多開一關總決賽只是把同一關再打一次。
    var stages = Rules.stagesFor(['taiwanese'], 10, 'stage');

    assertEqual(1, stages.length, '關數');
    assertEqual(['taiwanese'], stages[0].languages);
    assertEqual(null, stages[0].unlocks);
    assertEqual(6000, stages[0].scoreToClear);
  });

  test('關卡順序照 Rules.LANGUAGES 重排，不照勾選的先後', function () {
    // 先勾日語不代表日語該當第一關：由易到難是這個模式的設計意圖。
    var stages = Rules.stagesFor(['japanese', 'mandarin'], 10, 'stage');

    assertEqual(3, stages.length, '關數');
    assertEqual(['mandarin'], stages[0].languages, '第一關該是華語');
    assertEqual('japanese', stages[1].unlocks);
    assertEqual(['mandarin', 'japanese'], stages[2].languages);
    assertEqual([4000, 6500, 9000], thresholdsOf(stages), '三關的門檻');
  });

  test('每關五題時門檻按比例縮小，不會還停在四千', function () {
    var stages = Rules.stagesFor(Rules.LANGUAGES, 5, 'stage');

    assertEqual(6, stages.length, '關數不受題數影響');
    assertEqual([2000, 2500, 3000, 3500, 4000, 4500], thresholdsOf(stages));
    assertEqual(Rules.perfectScoreFor('stage', 5) * 0.4, stages[0].scoreToClear,
      '第一關還是該關滿分的四成');
  });

  test('重複勾同一個語種不會多生一關', function () {
    var stages = Rules.stagesFor(['mandarin', 'mandarin'], 10, 'stage');

    assertEqual(1, stages.length);
  });

  // ------------------------------------------------------------ 題庫容量

  group('題庫容量');

  test('歌夠多的時候 capacityFor 說 ok', function () {
    var check = Rules.capacityFor(fullBank(40), Rules.LANGUAGES, 10, 'stage');

    assertEqual(true, check.ok);
    assertEqual(60, check.needed, '六關 × 每關十題');
    assertEqual(200, check.available);
    assertEqual(0, check.shortfall.length);
  });

  test('闖關算的是整場的需求，湊不出來就 ok:false 並講出差多少', function () {
    // 華語四十首、台語五首、每關二十題 → 三關共要六十首，總共只有四十五首。
    var bank = bankOf([['mandarin', 40], ['taiwanese', 5]], 0);

    var check = Rules.capacityFor(bank, ['mandarin', 'taiwanese'], 20, 'stage');

    assertEqual(false, check.ok);
    assertEqual(60, check.needed);
    assertEqual(45, check.available);
    assertEqual(1, check.shortfall.length, '差的關數');
    assertEqual(3, check.shortfall[0].stage, '第三關才湊不出來');
    assertEqual(15, check.shortfall[0].missing, '還差幾首');
  });

  test('前面的關卡就湊不出來時指的是那一關，不是最後一關', function () {
    // 台語只有十二首，每關二十題——第一關就開不下去。
    var bank = bankOf([['taiwanese', 12]], 0);

    var check = Rules.capacityFor(bank, ['taiwanese'], 20, 'stage');

    assertEqual(false, check.ok);
    assertEqual(1, check.shortfall[0].stage);
    assertEqual(8, check.shortfall[0].missing);
  });

  test('勾了一首歌都沒有的語種也要講出來', function () {
    // 歌數上關卡撐得住，但「新解鎖語種保證出一題」永遠達不成，這也是湊不出來。
    var bank = bankOf([['mandarin', 40]], 0);

    var check = Rules.capacityFor(bank, ['mandarin', 'korean'], 5, 'stage');

    assertEqual(false, check.ok);
    assertEqual(1, check.shortfall.length);
    assertEqual(['korean'], check.shortfall[0].languages);
    assertEqual(0, check.shortfall[0].available);
  });

  test('競速與積分只算整場題數', function () {
    var bank = bankOf([['mandarin', 10]], 0);

    var enough = Rules.capacityFor(bank, ['mandarin'], 10, 'speed');
    assertEqual(true, enough.ok);
    assertEqual(10, enough.needed, '競速不乘關數');

    var tight = Rules.capacityFor(bank, ['mandarin'], 20, 'combo');
    assertEqual(false, tight.ok);
    assertEqual(10, tight.shortfall[0].missing);
  });

  // ------------------------------------------------------------------ 出題

  group('出題');

  test('一題永遠是九個選項', function () {
    var bank = bankOf([['mandarin', 20]], 30);

    for (var seed = 0; seed < 20; seed++) {
      var maker = new window.QuestionMaker(bank, makeRng(seed));
      var question = maker.next(['mandarin'], {});

      assertTrue(question !== null, '種子 ' + seed + ' 出不了題');
      assertEqual(Rules.CHOICE_COUNT, question.choices.length, '種子 ' + seed);
    }
  });

  test('選項不重複，且恰好有一個是正解', function () {
    // 跑多顆種子：這條不變式不能只在某個幸運的洗牌結果下成立。
    var bank = bankOf([['mandarin', 20]], 30);

    for (var seed = 0; seed < 20; seed++) {
      var maker = new window.QuestionMaker(bank, makeRng(seed));
      var question = maker.next(['mandarin'], {});
      var where = '種子 ' + seed;

      var labels = question.choices.map(function (choice) { return choice.label; });
      var unique = {};
      labels.forEach(function (label) { unique[label] = true; });
      assertEqual(labels.length, Object.keys(unique).length, where + ' 的選項有重複');

      var answerLabel = window.labelOf(question.answer);
      var hits = labels.filter(function (label) { return label === answerLabel; });
      assertEqual(1, hits.length, where + ' 正解出現的次數');

      var pointed = question.choices.filter(function (choice) {
        return choice.id === question.answerId;
      });
      assertEqual(1, pointed.length, where + ' answerId 指到的選項數');
      assertEqual(answerLabel, pointed[0].label, where + ' answerId 指到的不是正解');
    }
  });

  test('題庫只剩三首歌也要靠誘餌湊滿九個選項', function () {
    // 誘餌的存在意義就在這裡：歌少的時候選項數量不能縮水，
    // 否則玩家看選項多寡就知道這題出自哪個池子。
    var maker = new window.QuestionMaker(bankOf([['mandarin', 3]], 30), makeRng(3));

    var question = maker.next(['mandarin'], {});

    assertEqual(Rules.CHOICE_COUNT, question.choices.length);
  });

  test('不會出已經聽過的歌，聽完了回 null', function () {
    var maker = new window.QuestionMaker(bankOf([['mandarin', 4]], 30), makeRng(5));
    var used = {};

    for (var i = 0; i < 4; i++) {
      var question = maker.next(['mandarin'], used);
      assertTrue(question !== null, '第 ' + (i + 1) + ' 題出不來');
      assertTrue(!used[question.answer.id], '同一首歌被出了第二次');
      used[question.answer.id] = true;
    }

    assertEqual(null, maker.next(['mandarin'], used), '歌都出完了');
  });

  test('只出允許語種的歌', function () {
    var bank = bankOf([['mandarin', 10], ['japanese', 10]], 30);

    for (var seed = 0; seed < 20; seed++) {
      var maker = new window.QuestionMaker(bank, makeRng(seed));
      var question = maker.next(['mandarin'], {});
      assertEqual('mandarin', question.answer.language, '種子 ' + seed);
    }
  });

  test('指定語種時答案就是那個語種', function () {
    var bank = bankOf([['mandarin', 10], ['taiwanese', 10]], 30);

    for (var seed = 0; seed < 20; seed++) {
      var maker = new window.QuestionMaker(bank, makeRng(seed));
      var question = maker.next(['mandarin', 'taiwanese'], {}, 'taiwanese');
      assertEqual('taiwanese', question.answer.language, '種子 ' + seed);
    }
  });

  test('同一顆種子出一樣的題（可重現）', function () {
    var bank = bankOf([['mandarin', 20]], 30);

    var a = new window.QuestionMaker(bank, makeRng(42)).next(['mandarin'], {});
    var b = new window.QuestionMaker(bank, makeRng(42)).next(['mandarin'], {});

    assertEqual(a.answer.id, b.answer.id, '答案不同');
    assertEqual(a.choices.map(function (c) { return c.label; }),
                b.choices.map(function (c) { return c.label; }), '選項順序不同');
    assertEqual(a.offset, b.offset, '從試聽的哪裡開始放也要一樣');
  });

  test('每一題都有一個 0～1 的播放起點', function () {
    // 多人房間所有人必須聽到同一段，而他們唯一共享的是那顆種子——
    // 所以起點一定要在出題時決定，不能在播放時才 Math.random()。
    var bank = bankOf([['mandarin', 20]], 30);
    var maker = new window.QuestionMaker(bank, makeRng(7));
    var used = {};
    var seen = [];

    for (var i = 0; i < 8; i++) {
      var question = maker.next(['mandarin'], used);
      used[question.answer.id] = true;
      assertTrue(typeof question.offset === 'number', '第 ' + (i + 1) + ' 題沒有起點');
      assertTrue(question.offset >= 0 && question.offset < 1,
        '起點要落在 0～1，實際 ' + question.offset);
      seen.push(question.offset);
    }

    // 八題全都同一個值的話，那不是隨機，是寫死的。
    assertTrue(seen.filter(function (v) { return v !== seen[0]; }).length > 0,
      '每一題的起點都一樣，等於沒有隨機');
  });

  test('起點會跟著題目傳到畫面層', function () {
    var it = newGame({ mode: 'speed', questionCount: 5 });
    var view = it.game.nextQuestion();

    assertTrue(typeof view.offset === 'number', 'view 沒有帶 offset，畫面就不知道要從哪裡放');
    assertTrue(view.offset >= 0 && view.offset < 1);
  });

  // ------------------------------------------------------------ 競速模式

  group('競速模式');

  test('十題答完就結束', function () {
    var it = newGame({ mode: 'speed' });

    for (var i = 0; i < 10; i++) {
      var view = it.game.nextQuestion();
      assertTrue(view !== null, '第 ' + (i + 1) + ' 題出不來');
      assertEqual(i + 1, view.number, '題號');
      assertEqual(10, view.total, '總題數');
      assertEqual(Rules.CHOICE_COUNT, view.choices.length, '選項數');
      assertEqual(null, view.stageLabel, '競速模式不該有關卡標籤');
      assertEqual(0, view.stageCount, '競速模式沒有關卡');

      it.clock.advance(2);
      answerWrongly(it.game);
    }

    assertEqual(window.Game.Status.FINISHED, it.game.status);
    assertEqual(null, it.game.nextQuestion(), '結束之後還出題');
  });

  test('全對秒答就是滿分一萬', function () {
    var it = newGame({ mode: 'speed' });

    perfectRound(it.game);

    assertEqual(Rules.perfectScoreFor('speed', 10), it.game.totalScore);
    assertEqual(10000, it.game.totalScore);
    assertEqual(window.Game.Status.FINISHED, it.game.status);
  });

  test('沒作答等於答錯，零分', function () {
    var it = newGame({ mode: 'speed' });
    it.game.nextQuestion();
    it.clock.advance(3);

    var outcome = it.game.answer(null);

    assertEqual(false, outcome.correct);
    assertEqual(0, outcome.gained);
    assertEqual(0, it.game.totalScore);
  });

  test('逾時才答對也是零分', function () {
    var it = newGame({ mode: 'speed' });
    it.game.nextQuestion();
    it.clock.advance(30);

    var outcome = answerCorrectly(it.game);

    assertEqual(true, outcome.correct, '答的內容是對的');
    assertEqual(0, outcome.gained, '但逾時不給分');
  });

  test('答完之後會回報正解，前端才標得出來', function () {
    var it = newGame({ mode: 'speed' });
    var view = it.game.nextQuestion();
    it.clock.advance(1);

    var outcome = answerWrongly(it.game);

    assertEqual(false, outcome.correct);
    var labels = view.choices.map(function (choice) { return choice.label; });
    assertTrue(labels.indexOf(outcome.correctLabel) !== -1, '回報的正解不在選項裡');

    var pointed = view.choices.filter(function (choice) {
      return choice.id === outcome.correctChoiceId;
    });
    assertEqual(1, pointed.length, 'correctChoiceId 指到的選項數');
    assertEqual(outcome.correctLabel, pointed[0].label, 'correctChoiceId 指錯了');
  });

  test('沒有題目的時候作答會被擋掉', function () {
    var it = newGame({ mode: 'speed' });

    assertThrows(function () { it.game.answer(0); }, '還沒出題就作答');
  });

  test('同一題不能答兩次', function () {
    var it = newGame({ mode: 'speed' });
    it.game.nextQuestion();
    it.clock.advance(1);
    it.game.answer(0);

    assertThrows(function () { it.game.answer(1); }, '重複作答');
  });

  test('題庫湊不出題時回 null 而不是丟錯', function () {
    var thin = {
      tracks: [{
        id: 1, title: '唯一一首', artist: '甲',
        language: 'mandarin', previewUrl: 'https://example.test/1.m4a',
      }],
      decoys: [],
    };
    var it = newGame({ mode: 'speed', bank: thin });

    assertTrue(it.game.nextQuestion() !== null, '第一題出不來');
    it.clock.advance(1);
    it.game.answer(0);

    assertEqual(null, it.game.nextQuestion(), '歌用完了應該回 null');
  });

  test('作答紀錄留下歌名、對錯與秒數', function () {
    var it = newGame({ mode: 'speed' });
    it.game.nextQuestion();
    var song = it.game.current.answer;
    it.clock.advance(3);
    answerCorrectly(it.game);

    assertEqual(1, it.game.records.length);
    var record = it.game.records[0];
    assertEqual(song.title, record.title, '歌名');
    assertEqual(song.artist, record.artist, '歌手');
    assertEqual(song.language, record.language, '語種');
    assertEqual(true, record.correct, '對錯');
    assertEqual(3, record.seconds, '秒數');
    assertEqual(875, record.gained, '三秒答對的分數');
  });

  test('只挑一個語種時整場都只出那個語種', function () {
    var it = newGame({ mode: 'speed', languages: ['korean'] });

    perfectRound(it.game);

    assertEqual(10, it.game.records.length);
    it.game.records.forEach(function (record) {
      assertEqual('korean', record.language, '出現了沒勾的語種');
    });
  });

  // ------------------------------------------------------------ 闖關模式

  group('闖關模式');

  test('從第一關開始，門檻四千', function () {
    var it = newGame({ mode: 'stage' });

    assertEqual(1, it.game.stage);
    assertEqual(6, it.game.stageCount, '五個語種該有六關');

    var view = it.game.nextQuestion();
    assertEqual('第 1 關', view.stageLabel);
    assertEqual(4000, view.scoreToClear);
    assertEqual(1, view.stage);
    assertEqual(6, view.stageCount);
  });

  test('第一關只出華語，還沒解鎖的語種不會跑出來', function () {
    var it = newGame({ mode: 'stage' });

    perfectRound(it.game);

    assertEqual(10, it.game.records.length);
    it.game.records.forEach(function (record) {
      assertEqual('mandarin', record.language, '第一關出現了未解鎖的語種');
    });
  });

  test('分數不夠就 stageFailed，而且不再出題', function () {
    var it = newGame({ mode: 'stage' });

    for (var i = 0; i < 10; i++) {
      it.game.nextQuestion();
      it.clock.advance(1);
      it.game.answer(null); // 全部放空
    }

    assertEqual(window.Game.Status.STAGE_FAILED, it.game.status);
    assertEqual(0, it.game.roundScore);
    assertEqual(null, it.game.nextQuestion(), '失敗之後還出題');
  });

  test('剛好踩在門檻上算過關', function () {
    // 前四題秒答（每題 1000）＝ 4000，其餘全錯 → 正好等於第一關門檻。
    var it = newGame({ mode: 'stage' });

    var last = playRound(it.game, it.clock, 4, 0);

    assertEqual(4000, last.roundScore);
    assertEqual(window.Game.Status.STAGE_CLEARED, last.status);
  });

  test('只差一分就沒過關', function () {
    // 門檻是硬的：3999 不過，沒有「差一點就讓你過」。
    var it = newGame({ mode: 'stage' });

    var last = playRound(it.game, it.clock, 3, 1);

    assertEqual(3999, last.roundScore);
    assertEqual(window.Game.Status.STAGE_FAILED, last.status);
  });

  test('過關就進下一關，題數與該關分數重新起算', function () {
    var it = newGame({ mode: 'stage' });

    perfectRound(it.game);

    // 過關的那一刻就已經在第二關了，不必等到下一題才生效。
    assertEqual(window.Game.Status.STAGE_CLEARED, it.game.status);
    assertEqual(2, it.game.stage, '過關當下的關卡');
    assertEqual(0, it.game.roundScore, '該關分數要歸零');
    assertEqual(10000, it.game.totalScore, '累積分數不該被歸零');

    var view = it.game.nextQuestion();
    assertEqual('第 2 關', view.stageLabel);
    assertEqual(1, view.number, '新關卡從第一題開始');
    assertEqual(5000, view.scoreToClear);
  });

  test('過關的回報講的是剛打完的那一關', function () {
    // 畫面要寫「第 1 關過關！」，所以回報必須是舊關卡編號與那一關的分數，
    // 即使狀態機內部已經推進到第二關。
    var it = newGame({ mode: 'stage' });

    var last = null;
    for (var i = 0; i < 10; i++) {
      it.game.nextQuestion();
      last = answerCorrectly(it.game);
    }

    assertEqual(window.Game.Status.STAGE_CLEARED, last.status);
    assertEqual(1, last.stage, '回報的關卡');
    assertEqual(6, last.stageCount, '回報的總關數');
    assertEqual(4000, last.scoreToClear, '回報的門檻');
    assertEqual(10000, last.roundScore, '回報的該關分數');
    assertEqual(2, it.game.stage, '狀態機本身已經在第二關');
  });

  test('六關全破整場結束，累積六萬分', function () {
    var it = newGame({ mode: 'stage' });

    for (var stage = 1; stage <= 6; stage++) {
      assertEqual(stage, it.game.stage, '第 ' + stage + ' 關開打前的關卡編號');
      perfectRound(it.game);
    }

    assertEqual(window.Game.Status.FINISHED, it.game.status);
    assertEqual(6, it.game.stage, '全破之後不該再往上加');
    assertEqual(60000, it.game.totalScore);
    assertEqual(60, it.game.records.length);
  });

  test('第二關保證至少出一題台語', function () {
    // 第二關解鎖台語，那一關就不能整關都是華語，否則解鎖等於沒發生。
    // 這是「保證」而不是「大概會」，所以每顆種子都要成立。
    for (var seed = 0; seed < 10; seed++) {
      var it = newGame({ mode: 'stage', seed: seed });

      perfectRound(it.game); // 第一關
      perfectRound(it.game); // 第二關

      var stageTwo = languagesOf(it.game.records.slice(10));

      assertEqual(10, stageTwo.length, '種子 ' + seed + ' 第二關的題數');
      assertTrue(stageTwo.indexOf('taiwanese') !== -1, '種子 ' + seed + ' 第二關一題台語都沒出');
    }

    // 華語四百首、台語只有一首：隨機抽幾乎抽不到台語，
    // 所以這一段真正測到的是「保證出現」的機制本身，而不是運氣。
    var lopsided = newGame({
      mode: 'stage',
      bank: bankOf([['mandarin', 400], ['taiwanese', 1]], 0),
      languages: ['mandarin', 'taiwanese'],
    });

    perfectRound(lopsided.game);
    perfectRound(lopsided.game);

    var languages = languagesOf(lopsided.game.records.slice(10));
    assertTrue(languages.indexOf('taiwanese') !== -1, '台語再稀有也必須被硬塞進第二關');
  });

  test('整場不會重複出同一首歌', function () {
    var it = newGame({ mode: 'stage' });

    for (var stage = 1; stage <= 3; stage++) perfectRound(it.game);

    var seen = {};
    it.game.records.forEach(function (record) {
      var key = record.title + '|' + record.artist;
      assertTrue(!seen[key], '同一首歌出了第二次：' + key);
      seen[key] = true;
    });
  });

  test('選三個語種就是四關，第四關打完整場結束', function () {
    var it = newGame({ mode: 'stage', languages: ['mandarin', 'taiwanese', 'western'] });

    assertEqual(4, it.game.stageCount);

    for (var stage = 1; stage <= 4; stage++) {
      assertEqual(stage, it.game.stage, '第 ' + stage + ' 關開打前的關卡編號');
      perfectRound(it.game);
    }

    assertEqual(window.Game.Status.FINISHED, it.game.status);
    assertEqual(40000, it.game.totalScore);
  });

  test('只選一個語種就一關打完整場', function () {
    var it = newGame({ mode: 'stage', languages: ['japanese'] });

    assertEqual(1, it.game.stageCount);

    var view = it.game.nextQuestion();
    assertEqual(6000, view.scoreToClear, '一關的門檻是六成');
    answerCorrectly(it.game);

    for (var i = 1; i < 10; i++) {
      it.game.nextQuestion();
      answerCorrectly(it.game);
    }

    assertEqual(window.Game.Status.FINISHED, it.game.status, '一關打完就整場結束');
    assertEqual(1, it.game.stage);
    languagesOf(it.game.records).forEach(function (language) {
      assertEqual('japanese', language, '出現了沒勾的語種');
    });

  test('勾日語加華語，第一關還是華語', function () {
    var it = newGame({ mode: 'stage', languages: ['japanese', 'mandarin'] });

    assertEqual(3, it.game.stageCount);
    perfectRound(it.game);

    languagesOf(it.game.records).forEach(function (language) {
      assertEqual('mandarin', language, '第一關應該是比較熟的華語');
    });
  });

  test('每關五題時門檻也跟著縮，兩千就過關', function () {
    var it = newGame({ mode: 'stage', questionCount: 5 });

    var view = it.game.nextQuestion();
    assertEqual(5, view.total, '每關題數');
    assertEqual(2000, view.scoreToClear);
    answerCorrectly(it.game);

    var last = null;
    for (var i = 1; i < 5; i++) {
      it.game.nextQuestion();
      if (i === 1) {
        last = answerCorrectly(it.game); // 兩題秒答 = 2000，正好踩線
      } else {
        it.clock.advance(1);
        last = answerWrongly(it.game);
      }
    }

    assertEqual(2000, last.roundScore);
    assertEqual(window.Game.Status.STAGE_CLEARED, last.status);
  });

  // ------------------------------------------------------------ 積分模式

  group('積分模式');

  test('連對倍率從一路爬到五就封頂', function () {
    var it = newGame({ mode: 'combo' });

    var gains = [];
    for (var i = 0; i < 8; i++) {
      var view = it.game.nextQuestion();
      assertEqual(Rules.multiplierFor(i + 1), view.multiplier, '第 ' + (i + 1) + ' 題的倍率');
      gains.push(answerCorrectly(it.game).gained);
    }

    assertEqual([500, 1000, 1500, 2000, 2500, 2500, 2500, 2500], gains);
    assertEqual(8, it.game.streak, '連對數');
    assertEqual(5, it.game.multiplier, '封頂之後倍率不再往上');
  });

  test('答錯連對歸零，再從一倍重新爬', function () {
    var it = newGame({ mode: 'combo' });

    it.game.nextQuestion();
    assertEqual(500, answerCorrectly(it.game).gained, '第一連對');
    it.game.nextQuestion();
    var second = answerCorrectly(it.game);
    assertEqual(1000, second.gained, '第二連對');
    assertEqual(2, second.streak);
    assertEqual(3, second.multiplier, '下一題答對的倍率');

    it.game.nextQuestion();
    var missed = answerWrongly(it.game);
    assertEqual(0, missed.gained, '答錯不給分');
    assertEqual(0, missed.streak, '連對歸零');
    assertEqual(1, missed.multiplier, '倍率回到一倍');

    it.game.nextQuestion();
    assertEqual(500, answerCorrectly(it.game).gained, '重新從一倍爬');
  });

  test('積分模式不看速度，快答慢答同分', function () {
    var fast = newGame({ mode: 'combo' });
    var slow = newGame({ mode: 'combo' });

    for (var i = 0; i < 3; i++) {
      fast.game.nextQuestion();
      answerCorrectly(fast.game);

      slow.game.nextQuestion();
      slow.clock.advance(8);
      answerCorrectly(slow.game);
    }

    assertEqual(3000, fast.game.totalScore, '秒答三題');
    assertEqual(fast.game.totalScore, slow.game.totalScore, '拖到第八秒答對該同分');
  });

  test('積分模式逾時等於答錯，零分且連對歸零', function () {
    var it = newGame({ mode: 'combo' });

    it.game.nextQuestion();
    answerCorrectly(it.game);

    it.game.nextQuestion();
    it.clock.advance(Rules.QUESTION_SECONDS);
    var outcome = answerCorrectly(it.game);

    assertEqual(true, outcome.correct, '答的內容是對的');
    assertEqual(0, outcome.gained, '但逾時不給分');
    assertEqual(0, outcome.streak, '逾時也算斷連');
  });

  test('積分模式十題全對是兩萬', function () {
    var it = newGame({ mode: 'combo' });

    perfectRound(it.game);

    assertEqual(20000, it.game.totalScore);
    assertEqual(Rules.perfectScoreFor('combo', 10), it.game.totalScore);
    assertEqual(window.Game.Status.FINISHED, it.game.status);
    assertEqual(null, it.game.nextQuestion(), '結束之後還出題');
  });

  test('積分模式沒有關卡', function () {
    var it = newGame({ mode: 'combo' });

    assertEqual(0, it.game.stageCount);
    assertEqual(0, it.game.stage);

    var view = it.game.nextQuestion();
    assertEqual(null, view.stageLabel);
    assertEqual(0, view.scoreToClear);
    assertEqual(10, view.total);

  test('積分底分與倍率上限就是規則裡那兩個數', function () {
    assertEqual(500, Rules.COMBO_BASE);
    assertEqual(5, Rules.COMBO_MAX_MULTIPLIER);
    assertEqual(1, Rules.multiplierFor(1));
    assertEqual(5, Rules.multiplierFor(5));
    assertEqual(5, Rules.multiplierFor(99), '超過上限還是五倍');
  });

  // ------------------------------------------------------------ 自選題數

  group('自選題數');

  test('題數五、十五、二十都打得完', function () {
    Rules.QUESTION_COUNT_CHOICES.forEach(function (count) {
      var it = newGame({ mode: 'speed', questionCount: count });

      for (var i = 0; i < count; i++) {
        var view = it.game.nextQuestion();
        assertTrue(view !== null, count + ' 題的第 ' + (i + 1) + ' 題出不來');
        assertEqual(count, view.total, count + ' 題時回報的總題數');

      }

      assertEqual(window.Game.Status.FINISHED, it.game.status, count + ' 題打完該結束');
      assertEqual(count, it.game.records.length, count + ' 題的作答紀錄數');
      assertEqual(Rules.perfectScoreFor('speed', count), it.game.totalScore, count + ' 題的滿分');

  test('每關二十題的闖關也能全破六關', function () {
    var it = newGame({ mode: 'stage', questionCount: 20 });

    assertEqual([8000, 10000, 12000, 14000, 16000, 18000],
      thresholdsOf(it.game.stages), '每關二十題的門檻');

    for (var stage = 1; stage <= 6; stage++) perfectRound(it.game);

    assertEqual(window.Game.Status.FINISHED, it.game.status);
    assertEqual(120, it.game.records.length);
  });

  test('積分模式二十題的滿分是四萬五', function () {
    // 前四題爬倍率（500+1000+1500+2000），剩下十六題都是 2500。
    var it = newGame({ mode: 'combo', questionCount: 20 });

    perfectRound(it.game);

    assertEqual(45000, it.game.totalScore);
    assertEqual(Rules.perfectScoreFor('combo', 20), it.game.totalScore);
  });

  test('積分模式的題數清單開到八十，其他模式沒有', function () {
    // 積分是「連對能連多久」，本質上是一條可以一直往下猜的路，所以開到 80。
    assertEqual(80, Rules.questionCountsFor('combo').slice(-1)[0]);
    assertEqual(20, Rules.questionCountsFor('speed').slice(-1)[0]);
    assertEqual(20, Rules.questionCountsFor('stage').slice(-1)[0]);
    assertTrue(Rules.questionCountsFor('combo').indexOf(5) === -1,
      '積分模式不該出現 5 題——那條路的重點是連得久');
  });

  test('積分模式八十題真的打得完', function () {
    // 題庫要撐得住：同一場不重複出歌，八十題就是八十首不同的歌。
    var it = newGame({ mode: 'combo', questionCount: 80 });

    for (var i = 0; i < 80; i++) {
      var view = it.game.nextQuestion();
      assertTrue(view !== null, '第 ' + (i + 1) + ' 題出不來');
      assertEqual(80, view.total);
      answerCorrectly(it.game);
    }

    assertEqual(window.Game.Status.FINISHED, it.game.status);
    assertEqual(80, it.game.records.length);
  });

  test('換模式時題數會挪到新清單裡最接近的那一個', function () {
    // 在闖關選了 5 題再切到積分，5 題在積分那邊不存在，不能留一個挑不到的值。
    assertEqual(10, Rules.nearestCountFor('combo', 5));
    assertEqual(20, Rules.nearestCountFor('combo', 15));
    assertEqual(80, Rules.nearestCountFor('combo', 80));
    assertEqual(20, Rules.nearestCountFor('speed', 80));
    assertEqual(15, Rules.nearestCountFor('stage', 15));
  });

  test('題數是每關的量，不是整場的量', function () {
    var it = newGame({ mode: 'stage', questionCount: 5 });

    perfectRound(it.game); // 第一關五題

    assertEqual(5, it.game.records.length);
    assertEqual(2, it.game.stage, '五題就該打完第一關');
  });

  // ------------------------------------------------------------------ 渲染

  var passed = results.filter(function (entry) { return entry.ok; }).length;
  var line = 'RESULT ' + (passed === results.length ? 'PASS' : 'FAIL') +
             ' ' + passed + '/' + results.length;

  document.title = line;
  var heading = document.getElementById('result');
  heading.textContent = line;
  heading.className = passed === results.length ? 'pass' : 'fail';

  var report = document.getElementById('report');
  var groups = [];
  results.forEach(function (entry) {
    if (groups.indexOf(entry.group) === -1) groups.push(entry.group);
  });

  groups.forEach(function (name) {
    var title = document.createElement('h2');
    title.textContent = name;
    report.appendChild(title);

    var list = document.createElement('ul');
    results.filter(function (entry) { return entry.group === name; })
      .forEach(function (entry) {
        var item = document.createElement('li');
        item.className = entry.ok ? 'pass' : 'fail';
        item.textContent = entry.name;
        if (!entry.ok) {
          var why = document.createElement('span');
          why.className = 'why';
          why.textContent = entry.why;
          item.appendChild(why);
        }
        list.appendChild(item);
      });
    report.appendChild(list);
  });
})();
