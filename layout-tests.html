<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>版面測試</title>
<style>
  body {
    margin: 0;
    padding: 24px;
    background: #14161c;
    color: #d8dbe4;
    font: 15px/1.7 "Segoe UI", "Microsoft JhengHei", sans-serif;
  }
  h1 { margin: 0 0 4px; font-size: 22px; font-family: Consolas, monospace; }
  h1.pass { color: #57d98a; }
  h1.fail { color: #ff6b6b; }
  p.hint { margin: 0 0 20px; color: #7c8494; font-size: 13px; }
  h2 {
    margin: 24px 0 8px; font-size: 14px; font-weight: normal;
    color: #7c8494; border-bottom: 1px solid #262a33; padding-bottom: 4px;
  }
  ul { margin: 0; padding: 0; list-style: none; }
  li { padding: 2px 0; }
  li.pass::before { content: "通過　"; color: #57d98a; }
  li.fail::before { content: "失敗　"; color: #ff6b6b; }
  li.fail { color: #ff9d9d; }
  li .why {
    display: block; margin-left: 4em; color: #ffc9c9;
    font-family: Consolas, monospace; font-size: 13px;
  }
  /* 被測的那一份頁面。用 iframe 是因為版面問題只有在真的排版之後才看得到，
     而且寬度要能指定——同一份 HTML 在 390px 和 1200px 是兩種排法。 */
  iframe { display: block; border: 0; margin: 20px 0 0; }
</style>
</head>
<body>

<h1 id="result">RESULT 尚未執行</h1>
<p class="hint">
  這一頁量的是「畫面上實際排出來的樣子」，不是玩法——玩法在 tests.html。
  兩件事分開的理由：這一頁需要真的載入 index.html 並量尺寸，比較慢，而且
  無頭瀏覽器要加 <code>--allow-file-access-from-files</code> 才讀得到 iframe 裡的文件。
</p>
<div id="report"></div>

<iframe id="phone" src="index.html" width="390" height="844" title="手機寬度"></iframe>
<iframe id="desktop" src="index.html" width="1200" height="880" title="桌機寬度"></iframe>

<script>
(function () {
  'use strict';

  var results = [];
  var currentGroup = '其他';

  function group(name) { currentGroup = name; }

  function test(name, fn) {
    var entry = { group: currentGroup, name: name, ok: true, why: '' };
    try {
      fn();
    } catch (error) {
      entry.ok = false;
      entry.why = (error && error.message) ? error.message : String(error);
    }
    results.push(entry);
  }

  function assertTrue(value, note) {
    if (!value) throw new Error((note || '斷言') + '：預期成立，實際不成立');
  }

  function assertEqual(expected, actual, note) {
    if (expected !== actual) {
      throw new Error((note ? note + '，' : '') + '預期「' + expected + '」，實際「' + actual + '」');
    }
  }

  // ---------------------------------------------------------------- 取樣

  /** 一個被測頁面的量測工具。 */
  function view(id) {
    var frame = document.getElementById(id);
    var doc = frame.contentDocument;
    var win = frame.contentWindow;

    return {
      doc: doc,
      win: win,
      one: function (selector) { return doc.querySelector(selector); },
      style: function (selector, property) {
        var node = doc.querySelector(selector);
        if (!node) throw new Error('找不到元素：' + selector);
        return win.getComputedStyle(node)[property];
      },
      /** 一律量實際排出來的方框，不看 CSS 宣告——宣告對、被別條蓋掉的情況才是真正的 bug。 */
      box: function (selector) {
        var node = doc.querySelector(selector);
        if (!node) throw new Error('找不到元素：' + selector);
        return node.getBoundingClientRect();
      },
    };
  }

  function run() {
    var phone = view('phone');
    var desktop = view('desktop');

    // ------------------------------------------------------------ 手機

    group('手機（390px）');

    test('開始鈕釘在畫面底部，不必捲回去找', function () {
      assertEqual('fixed', phone.style('.dock', 'position'), '.dock 的定位方式');
      var dock = phone.box('.dock');
      var gap = phone.win.innerHeight - dock.bottom;
      assertTrue(Math.abs(gap) < 2, 'dock 底緣離視窗底部只差 ' + Math.round(gap) + 'px');
    });

    test('.dock 不會被 .screen 的進場動畫拖走', function () {
      // position: fixed 只要祖先有 transform 就會改用那個祖先當定位基準。
      // 進場動畫動的正是 transform，所以動畫必須掛在 .home-scroll（dock 的兄弟）上。
      assertEqual('none', phone.style('#screen-home', 'animationName'), '#screen-home 不該有動畫');
      assertTrue(phone.style('.home-scroll', 'animationName') !== 'none', '.home-scroll 應該有進場動畫');
    });

    test('捲到底的時候出處沒有被 dock 蓋住', function () {
      phone.win.scrollTo(0, 999999);
      var credit = phone.box('.credit');
      var dock = phone.box('.dock');
      assertTrue(credit.bottom <= dock.top,
        '出處底緣 ' + Math.round(credit.bottom) + '，dock 頂緣 ' + Math.round(dock.top));
      phone.win.scrollTo(0, 0);
    });

    test('排行榜的篩選條件收在一顆鈕後面', function () {
      // 全部攤開是十四到十五顆鈕，而它們出現的時機是「剛打完一場」——
      // 那個當下要看的是自己在榜上第幾，不是先做一輪篩選。
      function visibleButtons(scope) {
        var all = phone.doc.querySelectorAll(scope + ' button');
        var count = 0;
        for (var i = 0; i < all.length; i++) {
          var rect = all[i].getBoundingClientRect();
          if (rect.width > 0 && rect.height > 0) count++;
        }
        return count;
      }

      var result = phone.one('#screen-result');
      var wasHidden = result.hidden;
      result.hidden = false;

      var collapsed = visibleButtons('#result-board');
      var toggle = phone.one('#result-board .board-filter-toggle');
      assertTrue(!!toggle, '結算頁的榜沒有那顆篩選鈕');
      assertTrue(collapsed <= 5, '收起來還看得到 ' + collapsed + ' 顆鈕');

      toggle.click();
      var expanded = visibleButtons('#result-board');
      assertEqual('true', toggle.getAttribute('aria-expanded'), '展開後的 aria-expanded');
      assertTrue(expanded >= collapsed + 10,
        '展開後只多了 ' + (expanded - collapsed) + ' 顆鈕，條件沒有真的收在裡面');

      toggle.click();
      assertEqual(collapsed, visibleButtons('#result-board'), '再點一次要收回去');

      result.hidden = wasHidden;
    });

    test('收起來的時候，那一行字要講得出現在看的是哪一份榜', function () {
      // 條件藏起來但沒有摘要，等於不知道自己在看什麼——那比十七顆鈕更糟。
      var note = phone.one('#home-board .board-note');
      assertTrue(!!note, '找不到摘要那一行');
      assertTrue(phone.one('#home-board .board-head').contains(note),
        '摘要沒有跟篩選鈕放在同一行');
    });

    test('出處只有一份，而且在整頁的最後', function () {
      // 兩邊各放一份的時候，兩段文字已經長得不一樣了。
      // 授權聲明有兩個版本比只有一個版本更糟：改了其中一份，另一份就是錯的。
      assertEqual(1, phone.doc.querySelectorAll('.credit').length, '出處的份數');
      var last = phone.one('#app').lastElementChild;
      assertTrue(last.classList.contains('credit'),
        '最後一個元素是 ' + last.className + '，不是出處');
    });

    test('切到多人那一半，出處還在（它在兩半之外）', function () {
      phone.one('.seg .who-pick[data-who="room"]').click();
      assertTrue(phone.box('.credit').height > 0, '多人畫面上看不到出處');
      phone.one('#r-screen-lobby .seg .who-pick[data-who="solo"]').click();
    });

    test('只有首頁要留位置給釘在底部的開始鈕', function () {
      // 留位置的是 #app（body.has-dock），不是 .home-scroll——
      // 頁尾在 .home-scroll 外面，位置留錯地方它就會被那條蓋住。
      assertTrue(phone.doc.body.classList.contains('has-dock'), '首頁應該要留位置');
      phone.one('.seg .who-pick[data-who="room"]').click();
      assertTrue(!phone.doc.body.classList.contains('has-dock'), '多人那半沒有那條，不該留位置');
      phone.one('#r-screen-lobby .seg .who-pick[data-who="solo"]').click();
      assertTrue(phone.doc.body.classList.contains('has-dock'), '切回來要再留位置');
    });

    test('語種與題數不橫向捲動，全部看得到', function () {
      // 橫向捲動看起來省位置，但它把「還有幾個選項」藏起來了。
      ['#lang-chips', '#count-chips'].forEach(function (selector) {
        var rail = phone.one(selector);
        assertTrue(rail.scrollWidth <= rail.clientWidth + 1,
          selector + ' 捲得動（scrollWidth ' + rail.scrollWidth + ' / clientWidth ' + rail.clientWidth + '）');
        assertEqual('wrap', phone.style(selector, 'flexWrap'), selector + ' 應該換行排開');
      });
    });

    test('九個選項永遠是 3×3', function () {
      // 不隨寬度改欄數：九宮格的位置本身就是記憶點，換裝置不該重新找。
      //
      // 這裡不能讀 gridTemplateColumns：遊戲畫面平常是 display: none，
      // 那種狀態下讀到的是還沒解析的原始字串（"repeat(3, 1fr)"），
      // 拿去 split 會得到兩段，看起來像兩欄。所以真的把九顆排出來，量它們的位置。
      [['手機', phone], ['桌機', desktop]].forEach(function (pair) {
        var name = pair[0];
        var v = pair[1];
        var play = v.one('#screen-play');
        var box = v.one('#choices');
        var wasHidden = play.hidden;

        play.hidden = false;
        box.replaceChildren();
        for (var i = 0; i < 9; i++) {
          var button = v.doc.createElement('button');
          button.className = 'choice';
          var title = v.doc.createElement('b');
          title.textContent = '測試歌名' + i;
          var artist = v.doc.createElement('i');
          artist.textContent = '測試歌手';
          button.append(title, artist);
          box.append(button);
        }

        var columns = {};
        var rows = {};
        for (var j = 0; j < box.children.length; j++) {
          var rect = box.children[j].getBoundingClientRect();
          columns[Math.round(rect.left)] = true;
          rows[Math.round(rect.top)] = true;
        }

        // 順便驗第七項：歌名要比歌手大，而且各佔一行。
        var titleSize = parseFloat(v.win.getComputedStyle(box.children[0].querySelector('b')).fontSize);
        var artistSize = parseFloat(v.win.getComputedStyle(box.children[0].querySelector('i')).fontSize);
        var titleWeight = Number(v.win.getComputedStyle(box.children[0].querySelector('b')).fontWeight);
        var titleRect = box.children[0].querySelector('b').getBoundingClientRect();
        var artistRect = box.children[0].querySelector('i').getBoundingClientRect();

        box.replaceChildren();
        play.hidden = wasHidden;

        assertEqual(3, Object.keys(columns).length, name + '的欄數');
        assertEqual(3, Object.keys(rows).length, name + '的列數');
        assertTrue(titleSize > artistSize,
          name + '：歌名 ' + titleSize + 'px 沒有比歌手 ' + artistSize + 'px 大');
        assertTrue(titleWeight >= 700, name + '：歌名沒有粗體（' + titleWeight + '）');
        assertTrue(artistRect.top >= titleRect.bottom - 1, name + '：歌手沒有換行到歌名下面');
      });
    });



    test('模式是三張並排的小卡，長說明收起來', function () {
      var columns = phone.style('#screen-home .modes', 'gridTemplateColumns').split(' ');
      assertEqual(3, columns.length, '模式的欄數');
      assertEqual('none', phone.style('#screen-home .mode span', 'display'), '長說明在手機上的 display');
      assertEqual('block', phone.style('#screen-home .mode-short', 'display'), '短句在手機上的 display');
    });

    test('每個可點的東西都摸得到（至少 40px 高）', function () {
      var selectors = ['.seg .who-pick', '#lang-chips .chip', '#count-chips .chip', '#btn-start', '#btn-settings'];

      selectors.forEach(function (selector) {
        var height = phone.box(selector).height;
        assertTrue(height >= 40, selector + ' 只有 ' + Math.round(height) + 'px 高');
      });
    });

    // ------------------------------------------------------------ 顏色

    group('設定面板');

    test('齒輪在每個畫面都構得到，而且壓在開始鈕那條之上', function () {
      assertEqual('fixed', phone.style('#btn-settings', 'position'), '齒輪的定位方式');
      var gear = Number(phone.style('#btn-settings', 'zIndex'));
      var dock = Number(phone.style('.dock', 'zIndex'));
      assertTrue(gear > dock, '齒輪 z-index ' + gear + '，dock ' + dock);
    });

    test('面板預設關著，點齒輪才開', function () {
      assertEqual('none', phone.style('#settings', 'display'), '一開始的 display');
      phone.one('#btn-settings').click();
      assertTrue(phone.style('#settings', 'display') !== 'none', '點了之後應該打開');
      assertEqual('true', phone.one('#btn-settings').getAttribute('aria-expanded'), 'aria-expanded');
    });

    test('音量與試聽在面板裡，只有一份', function () {
      assertEqual(1, phone.doc.querySelectorAll('#volume').length, '音量滑桿的數量');
      assertTrue(phone.one('#settings').contains(phone.one('#volume')), '音量應該在面板裡');
      assertTrue(phone.one('#settings').contains(phone.one('#btn-test')), '試聽應該在面板裡');
    });

    test('在單人這邊不給「離開房間」', function () {
      assertTrue(phone.one('#btn-settings-leave').hidden, '單人不該看到離開房間');
    });

    test('切成日間版，底色真的變亮', function () {
      function luminance(color) {
        var nums = color.match(/\d+/g).map(Number);
        return (nums[0] * 299 + nums[1] * 587 + nums[2] * 114) / 1000;
      }
      phone.one('#theme-pick [data-theme="dark"]').click();
      var dark = luminance(phone.style('body', 'backgroundColor') === 'rgba(0, 0, 0, 0)'
        ? phone.style('html', 'backgroundColor') : phone.style('body', 'backgroundColor'));
      phone.one('#theme-pick [data-theme="light"]').click();
      var light = luminance(phone.style('html', 'backgroundColor'));
      assertTrue(light > dark + 100, '日間 ' + Math.round(light) + ' 對夜間 ' + Math.round(dark));
    });

    test('日間版的字仍然讀得到（不是把夜間版調亮而已）', function () {
      // 主色 #f7b955 配白底只有 1.8:1，日間版一定要換一個更深的琥珀。
      var css = phone.win.getComputedStyle(phone.doc.documentElement);
      var accent = css.getPropertyValue('--accent').trim();
      assertTrue(accent !== '#f7b955', '日間版的主色還是夜間那一個：' + accent);
      phone.one('#theme-pick [data-theme="auto"]').click();
      phone.one('#btn-settings-close').click();
    });

    group('顏色');

    /**
     * WCAG 的對比度。回傳 1（完全看不出來）到 21（黑配白）。
     * 一般大小的字要 4.5 以上——低於這個數在戶外或投影幕上就是「看不清楚」，
     * 而這個 app 兩種場合都會遇到。
     */
    function luminanceOf(rgb) {
      var parts = rgb.map(function (value) {
        var v = value / 255;
        return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4);
      });
      return .2126 * parts[0] + .7152 * parts[1] + .0722 * parts[2];
    }

    function contrast(front, back) {
      var a = luminanceOf(front) + .05;
      var b = luminanceOf(back) + .05;
      return a > b ? a / b : b / a;
    }

    /** #rrggbb 或 rgb()/rgba() 都吃。rgba 要疊在底色上算，透明本身沒有對比可言。 */
    function colorOf(text, over) {
      text = String(text).trim();
      var rgb, alpha = 1;

      if (text.charAt(0) === '#') {
        var n = parseInt(text.slice(1), 16);
        rgb = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
      } else {
        var nums = text.match(/[\d.]+/g).map(Number);
        rgb = nums.slice(0, 3);
        if (nums.length > 3) alpha = nums[3];
      }

      if (alpha >= 1 || !over) return rgb;
      return rgb.map(function (value, i) {
        return value * alpha + over[i] * (1 - alpha);
      });
    }

    /** 量一整組配色，回傳最差的那一對。theme 是 'light' 或 'dark'。 */
    function worstPairIn(view, theme) {
      view.one('#theme-pick [data-theme="' + theme + '"]').click();
      var css = view.win.getComputedStyle(view.doc.documentElement);
      function token(name) { return css.getPropertyValue(name).trim(); }

      // 直接落在頁面上的字（摘要、出處、區塊標籤）要對「真的畫出來的背景」量，
      // 不是對 --bg——那上面還疊著幾層漸層。
      var bg = pageBackground(token);
      var raised = colorOf(token('--bg-raised'));

      var pairs = [
        ['內文', token('--ink'), raised],
        ['次要文字', token('--ink-dim'), raised],
        ['主色當文字', token('--accent'), bg],
        ['第二色當文字', token('--accent-2'), bg],
        ['答對', token('--good'), raised],
        ['答錯', token('--bad'), raised],
        ['主要按鈕的字', token('--on-accent'), colorOf(token('--accent'))],
        ['警告框的字', token('--warn'), colorOf(token('--warn-soft'), raised)],
        ['錯誤框的字', token('--bad-ink'), colorOf(token('--bad-soft'), raised)]
      ];

      var worst = null;
      pairs.forEach(function (pair) {
        var ratio = contrast(colorOf(pair[1], pair[2]), pair[2]);
        if (!worst || ratio < worst.ratio) worst = { name: pair[0], ratio: ratio, color: pair[1] };
      });

      return worst;
    }

    test('日間版每一組字都讀得到（對比 4.5 以上）', function () {
      var worst = worstPairIn(phone, 'light');
      assertTrue(worst.ratio >= 4.5,
        '最差的是「' + worst.name + '」' + worst.color + '，只有 ' + worst.ratio.toFixed(2) + ':1');
    });

    test('夜間版每一組字都讀得到（對比 4.5 以上）', function () {
      var worst = worstPairIn(phone, 'dark');
      assertTrue(worst.ratio >= 4.5,
        '最差的是「' + worst.name + '」' + worst.color + '，只有 ' + worst.ratio.toFixed(2) + ':1');
      phone.one('#theme-pick [data-theme="auto"]').click();
    });

    /**
     * 頁面真正畫出來的底色。
     *
     * 不能直接拿 --bg 當背景來量：body::before 還疊了幾層漸層（頂燈、冷光、
     * 唱片標籤），文字實際上是落在那幾層之上的。只量 --bg 會得到一個
     * 「測試過了但看起來還是不對」的結果——第一版就是這樣過關的。
     */
    function pageBackground(token) {
      var base = colorOf(token('--bg'));
      // 由下往上疊：舞台光 → 溝紋 → 標籤 → 冷光 → 頂燈。
      ['--stage-light', '--groove', '--label', '--lamp-2', '--lamp'].forEach(function (name) {
        base = colorOf(token(name), base);
      });
      return base;
    }

    test('日間版看得出結構：卡片浮在頁面上、邊框看得見', function () {
      // 「不清晰」多半不是字的問題，是結構的問題。
      // 第一版頁面 #f6f2ea 配卡片 #ffffff 只差 3% 亮度，卡片就不像卡片了。
      phone.one('#theme-pick [data-theme="light"]').click();
      var css = phone.win.getComputedStyle(phone.doc.documentElement);
      function token(name) { return css.getPropertyValue(name).trim(); }

      var page = pageBackground(token);
      var card = colorOf(token('--bg-raised'));
      var line = colorOf(token('--line'), card);
      phone.one('#theme-pick [data-theme="auto"]').click();

      assertTrue(contrast(card, page) >= 1.2,
        '卡片和頁面只差 ' + contrast(card, page).toFixed(2) + ':1，卡片不像卡片');
      assertTrue(contrast(line, card) >= 1.9,
        '邊框對卡片只有 ' + contrast(line, card).toFixed(2) + ':1，框線等於沒有');
    });

    test('「被選中」在兩種主題下都一眼看得出來', function () {
      // 選中和沒選中差不多，是這一頁最貴的一種不清楚：
      // 語種、題數、模式全靠這個狀態表達。
      ['light', 'dark'].forEach(function (theme) {
        phone.one('#theme-pick [data-theme="' + theme + '"]').click();
        var css = phone.win.getComputedStyle(phone.doc.documentElement);
        function token(name) { return css.getPropertyValue(name).trim(); }

        var card = colorOf(token('--bg-raised'));
        var picked = colorOf(token('--sel'), card);
        assertTrue(contrast(picked, card) >= 1.25,
          theme + '：選中的底和沒選中只差 ' + contrast(picked, card).toFixed(2) + ':1');

        // 整塊卡片（模式）的選中底色刻意比膠囊淡——整片刷滿會太吵。
        // 所以它靠的是邊框：選中的框和一般的框要明顯不同，否則就沒有線索了。
        var normalLine = colorOf(token('--line'), card);
        var pickedLine = colorOf(token('--accent'), card);
        assertTrue(contrast(pickedLine, normalLine) >= 1.6,
          theme + '：選中的框和一般的框只差 ' + contrast(pickedLine, normalLine).toFixed(2) + ':1');

        // 選中之後字還是要讀得到——刷了底卻看不到字是更糟的結果。
        assertTrue(contrast(colorOf(token('--ink')), picked) >= 4.5,
          theme + '：選中之後字只剩 ' + contrast(colorOf(token('--ink')), picked).toFixed(2) + ':1');

  /** 兩個十六進位色的色相差幾度。只用來判斷「會不會被看成同一個顏色」。 */
  function hueGap(a, b) {
    var gap = Math.abs(hueOf(a) - hueOf(b));
    return gap > 180 ? 360 - gap : gap;
  }

  function hueOf(hex) {
    var n = parseInt(hex.replace('#', ''), 16);
    var r = ((n >> 16) & 255) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
    var max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
    if (!d) return 0;
    var h;
    if (max === r) h = ((g - b) / d) % 6;
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60;
    return h < 0 ? h + 360 : h;
  }

  // ---------------------------------------------------------------- 報告

  function report() {
    var passed = results.filter(function (entry) { return entry.ok; }).length;
    var line = 'RESULT ' + (passed === results.length ? 'PASS' : 'FAIL') +
               ' ' + passed + '/' + results.length;

    document.title = line;
    var heading = document.getElementById('result');
    heading.textContent = line;
    heading.className = passed === results.length ? 'pass' : 'fail';

    var host = document.getElementById('report');
    var groups = [];
    results.forEach(function (entry) {
      if (groups.indexOf(entry.group) === -1) groups.push(entry.group);
    });

    groups.forEach(function (name) {
      var title = document.createElement('h2');
      title.textContent = name;
      host.appendChild(title);

      var list = document.createElement('ul');
      results.filter(function (entry) { return entry.group === name; })
        .forEach(function (entry) {
          var item = document.createElement('li');
          item.className = entry.ok ? 'pass' : 'fail';
          item.textContent = entry.name;
          if (!entry.ok) {
            var why = document.createElement('span');
            why.className = 'why';
            why.textContent = entry.why;
            item.appendChild(why);
          }
          list.appendChild(item);
        });
      host.appendChild(list);
    });
  }

  /**
   * 等兩個 iframe 都把設定畫出來才開始量。
   * 不能只等 load：語種那幾顆是 app.js 依題庫產生的，load 當下還是空的。
   * 也不能無限等：讀不到就要把原因印出來，否則無頭跑起來只會看到一片空白。
   */
  var tries = 0;
  var timer = setInterval(function () {
    tries++;
    var ready = false;
    try {
      ready = ['phone', 'desktop'].every(function (id) {
        var doc = document.getElementById(id).contentDocument;
        // readyState 一定要等到 complete：語種是 app.js 畫的，但切換鈕的事件是
        // 排在它後面的 shell.js 掛的。只等語種出現，會有幾成機率在事件掛上之前
        // 就開始點——點下去沒反應，測試看起來像版面壞了，其實是測試自己太早跑。
        if (!doc || doc.readyState !== 'complete') return false;
        var chips = doc.getElementById('lang-chips');
        return !!(chips && chips.children.length > 0);
      });
    } catch (error) {
      // file:// 的 iframe 預設是跨來源的。無頭要加 --allow-file-access-from-files。
    }

    if (ready) {
      clearInterval(timer);
      run();
      return;
    }

    if (tries > 100) {
      clearInterval(timer);
      results.push({
        group: '取樣',
        name: '讀得到被測頁面',
        ok: false,
        why: '等不到 index.html 把語種畫出來。從 file:// 跑的話，無頭瀏覽器要加 --allow-file-access-from-files。',
      });
      report();
    }
  }, 50);
})();
