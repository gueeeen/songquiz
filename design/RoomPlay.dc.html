<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root {
      --bg: #090e1a; --bg-raised: #141b2e; --line: #26314d;
      --ink: #eef2ff; --ink-dim: #93a2c7;
      --accent: #f7b955; --accent-2: #5ee0ff; --good: #3ddc97; --bad: #ff5c7c; --radius: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background:
        radial-gradient(900px 520px at 50% -8%, rgba(247,185,85,.10), transparent 62%),
        radial-gradient(760px 520px at 108% 94%, rgba(94,224,255,.07), transparent 60%),
        radial-gradient(circle at 50% 20%, rgba(247,185,85,.055) 0 54px, transparent 56px),
        repeating-radial-gradient(circle at 50% 20%, rgba(255,255,255,.026) 0 1px, transparent 1px 9px),
        radial-gradient(1200px 600px at 50% -10%, #16233f 0%, transparent 60%),
        var(--bg);
      color: var(--ink);
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    }
    a { color: var(--accent-2); } a:hover { color: var(--accent); }
    .app { padding: 24px 16px 40px; }
    .net { margin: 0 0 8px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg-raised); color: var(--good); font-size: .78rem; }
    .hud { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
    .progress { color: var(--ink-dim); font-size: .85rem; }
    .mode-line { color: var(--ink-dim); font-size: .74rem; }
    .timer { height: 10px; background: var(--bg-raised); border-radius: 99px; overflow: hidden; margin-bottom: 6px; }
    .timer-bar { height: 100%; width: 40%; background: linear-gradient(90deg, var(--accent-2), var(--accent)); }
    .timer-text { display: block; text-align: right; font-size: .78rem; color: var(--ink-dim); margin-bottom: 12px; }
    .hint { color: var(--good); font-size: .85rem; text-align: center; margin: 6px 0 14px; }
    .choices { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .choice {
      padding: 14px 12px; min-height: 64px; background: var(--bg-raised);
      border: 1px solid var(--line); border-radius: var(--radius);
      color: inherit; font-size: .85rem; line-height: 1.45; text-align: left; opacity: .55;
    }
    .choice.mine { border-color: var(--good); background: rgba(61,220,151,.14); opacity: 1; }
    .board-title { margin: 20px 0 8px; font-size: .95rem; }
    .board-title small { color: var(--ink-dim); font-size: .74rem; margin-left: 8px; font-weight: normal; }
    .board { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
    .board li {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 12px; background: var(--bg-raised); border: 1px solid var(--line);
      border-radius: 10px; font-size: .85rem;
    }
    .board li.me { border-color: var(--accent); }
    .board li b { font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<div class="app">
  <p class="net">同機測試（BroadcastChannel）：已連線</p>

  <div class="hud">
    <span class="progress">第 4 / 10 題</span>
    <span class="mode-line">競速 · 隨機出題</span>
  </div>

  <div class="timer"><div class="timer-bar"></div></div>
  <span class="timer-text">4.8</span>

  <p class="hint">答對！＋892　等其他人…</p>

  <div class="choices">
    <button class="choice">小幸運 — 田馥甄</button>
    <button class="choice">魚仔 — 盧廣仲</button>
    <button class="choice">浪子回頭 — 茄子蛋</button>
    <button class="choice mine">晴天 — 周杰倫</button>
    <button class="choice">李白 — 李榮浩</button>
    <button class="choice">你敢不敢 — 徐佳瑩</button>
    <button class="choice">愛人錯過 — 告五人</button>
    <button class="choice">我很好騙 — 動力火車</button>
    <button class="choice">不為誰而作的歌 — 林俊傑</button>
  </div>

  <h2 class="board-title">目前比分<small>答對的都有分・房主裁判</small></h2>
  <ol class="board">
    <li class="me"><span>阿明（你）</span><b>2,731 分</b></li>
    <li><span>小美</span><b>2,554 分</b></li>
    <li><span>大雄</span><b>1,690 分</b></li>
    <li><span>阿華</span><b>845 分</b></li>
  </ol>
</div>
</x-dc>
</body>
</html>
