<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root {
      --bg: #090e1a; --bg-raised: #141b2e; --line: #26314d;
      --ink: #eef2ff; --ink-dim: #93a2c7;
      --accent: #f7b955; --accent-2: #5ee0ff; --good: #3ddc97; --bad: #ff5c7c; --radius: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background:
        radial-gradient(900px 520px at 50% -8%, rgba(247,185,85,.10), transparent 62%),
        radial-gradient(760px 520px at 108% 94%, rgba(94,224,255,.07), transparent 60%),
        radial-gradient(circle at 50% 20%, rgba(247,185,85,.055) 0 54px, transparent 56px),
        repeating-radial-gradient(circle at 50% 20%, rgba(255,255,255,.026) 0 1px, transparent 1px 9px),
        radial-gradient(1200px 600px at 50% -10%, #16233f 0%, transparent 60%),
        var(--bg);
      color: var(--ink);
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    }
    .app { padding: 24px 16px 40px; }
    .gear {
      position: absolute; top: 18px; right: 14px;
      width: 42px; height: 42px; border-radius: 99px;
      border: 1px solid var(--line); background: var(--bg-raised);
      color: var(--ink-dim); font-size: 1.05rem; display: grid; place-items: center;
    }
    .hud { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 14px; padding-right: 52px; }
    .stage { color: var(--accent); font-weight: 700; font-size: .95rem; display: block; }
    .progress, .target { color: var(--ink-dim); font-size: .8rem; }
    .score { font-size: 1.6rem; font-weight: 700; display: block; text-align: right; }
    .timer { height: 10px; background: var(--bg-raised); border-radius: 99px; overflow: hidden; margin-bottom: 6px; }
    .timer-bar { height: 100%; width: 62%; background: linear-gradient(90deg, var(--accent-2), var(--accent)); }
    .timer-text { display: block; text-align: right; font-size: .78rem; color: var(--ink-dim); margin-bottom: 12px; }
    .hint { color: var(--ink-dim); font-size: .85rem; text-align: center; margin: 6px 0 14px; }

    /* 永遠 3x3。不隨寬度改欄數：九宮格的位置本身就是記憶點——
       右下角那一格在手機和桌機指的是同一個。要縮放的是字，不是排法。 */
    .choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .choice {
      display: grid; align-content: center; gap: 3px;
      padding: 12px 10px; min-height: 72px;
      background: var(--bg-raised); border: 1px solid var(--line); border-radius: var(--radius);
      text-align: left;
    }
    /* 歌名比歌手大、粗體、各佔一行：人是靠歌名認歌的，
       歌手是用來排除「同名不同版本」的第二層資訊。 */
    .choice b { font-size: .88rem; font-weight: 700; line-height: 1.3; }
    .choice i { font-style: normal; font-size: .72rem; line-height: 1.3; color: var(--ink-dim); }
    .choice.correct { border-color: var(--good); background: rgba(61,220,151,.14); }
    .choice.correct i { color: inherit; opacity: .75; }

    .verdict {
      margin-top: 16px; padding: 16px; background: var(--bg-raised);
      border: 1px solid var(--line); border-radius: var(--radius);
      display: grid; gap: 8px; justify-items: center; text-align: center;
    }
    .verdict strong { font-size: 1.1rem; color: var(--good); }
    .verdict span { color: var(--ink-dim); font-size: .85rem; }
  </style>
</helmet>

<div class="gear">⚙</div>

<div class="app">
  <div class="hud">
    <div>
      <span class="stage">第 2 / 6 關</span>
      <span class="progress">第 4 / 10 題</span>
    </div>
    <div>
      <span class="score">3,240</span>
      <span class="target">過關需 5,000</span>
    </div>
  </div>

  <div class="timer"><div class="timer-bar"></div></div>
  <span class="timer-text">7.4</span>

  <p class="hint">正在播放…選出你聽到的那一首</p>

  <div class="choices">
    <div class="choice"><b>小幸運</b><i>田馥甄</i></div>
    <div class="choice"><b>魚仔</b><i>盧廣仲</i></div>
    <div class="choice"><b>浪子回頭</b><i>茄子蛋</i></div>
    <div class="choice correct"><b>晴天</b><i>周杰倫</i></div>
    <div class="choice"><b>李白</b><i>李榮浩</i></div>
    <div class="choice"><b>你敢不敢</b><i>徐佳瑩</i></div>
    <div class="choice"><b>愛人錯過</b><i>告五人</i></div>
    <div class="choice"><b>我很好騙</b><i>動力火車</i></div>
    <div class="choice"><b>不為誰而作的歌</b><i>林俊傑</i></div>
  </div>

  <div class="verdict">
    <strong>答對！＋1,482</strong>
    <span>晴天 — 周杰倫</span>
  </div>
</div>
</x-dc>
</body>
</html>
